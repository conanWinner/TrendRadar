    - {"id": "techcrunch-ai", "name": "TechCrunch — AI (EN)", "url": "https://techcrunch.com/category/artificial-intelligence/feed/", "enabled": false, "max_age_days": 3}
    - {"id": "ars-tech", "name": "Ars Technica — Công nghệ (EN)", "url": "https://feeds.arstechnica.com/arstechnica/technology-lab", "enabled": false, "max_age_days": 3}
