# ═══════════════════════════════════════════════════════════════
#                    Tệp cấu hình TrendRadar
#                      Version: 2.4.0
# ═══════════════════════════════════════════════════════════════


# Địa chỉ trình chỉnh sửa cấu hình trực quan: https://sansan0.github.io/TrendRadar/


# ===============================================================
# 1. Cài đặt cơ bản
# ===============================================================
app:
  # Cấu hình múi giờ (ảnh hưởng đến mọi thời điểm hiển thị, lịch chạy và dữ liệu lưu trữ)
  # Các múi giờ thường dùng:
  #   - Asia/Shanghai (giờ Bắc Kinh UTC+8)
  #   - America/New_York (giờ miền Đông Hoa Kỳ UTC-5/-4)
  #   - Europe/London (giờ London UTC+0/+1)
  # Danh sách múi giờ đầy đủ: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  timezone: "Asia/Shanghai"
  show_version_update: true           # Có hiển thị thông báo cập nhật phiên bản hay không (true=hiện, false=ẩn)


# ===============================================================
# 1.5 Lịch chạy — thời điểm thực hiện từng việc
#
# Tự động quyết định dựa trên các khung giờ được định nghĩa trong timeline.yaml:
#   - Thời điểm gửi thông báo
#   - Thời điểm phân tích bằng AI
#   - Chế độ báo cáo sẽ dùng
#
# Bắt đầu nhanh: chọn một mẫu có sẵn và sửa giá trị preset
#
#   always_on       → Hoạt động cả ngày, có tin mới là gửi ngay
#   morning_evening → Gửi tin cả ngày + tổng hợp trong ngày vào buổi tối (khuyên dùng)
#   office_hours    → Ba khung giờ ngày làm việc (đến nơi → giữa ngày → hết giờ); cuối tuần tự do gửi tin mới
#   night_owl       → Điểm tin buổi chiều + tổng hợp cả ngày vào đêm muộn
#   custom          → Tự cấu hình hoàn toàn, xem timeline.yaml
#
# Xem sơ đồ thời gian chi tiết trong config/timeline.yaml
# ===============================================================
schedule:
  enabled: false # Bật lịch chạy hay không (true=bật, false=tắt, mặc định tắt)
  preset: "office_hours" # Tên mẫu có sẵn (xem giải thích bên trên)


# ===============================================================
# 2. Nguồn dữ liệu - nền tảng bảng xếp hạng xu hướng
#
# Dữ liệu lấy từ dự án mã nguồn mở newsnow: https://github.com/ourongxing/newsnow
# Bạn có thể tự triển khai newsnow và trỏ api_url đến phiên bản của mình
#
# enabled: Có bật thu thập bảng xếp hạng xu hướng hay không (công tắc tổng)
# api_url: Địa chỉ API dữ liệu xu hướng (không bắt buộc; để trống sẽ dùng địa chỉ mặc định)
# sources: Danh sách nền tảng
#   - id: Mã định danh duy nhất của nền tảng (không sửa)
#   - name: Tên hiển thị (có thể tùy chỉnh; sửa không ảnh hưởng hoạt động)
#   - expected_domain: Kiểm tra an toàn tên miền (không bắt buộc, khuyến nghị cấu hình)
#     Điền tên miền chính (ví dụ baidu.com); hệ thống tự khớp tên miền này và mọi tên miền con
#     Kiểm tra liên kết trả về có dùng HTTPS và đúng tên miền không; nếu không khớp, dữ liệu của nền tảng sẽ bị loại và cảnh báo được ghi lại
#     Giúp ngăn chặn hiệu quả việc chiếm quyền liên kết hoặc sửa đổi dữ liệu
#     Khuyến nghị cấu hình expected_domain nếu api_url không trỏ đến phiên bản do bạn tự triển khai
# ===============================================================
platforms:
  enabled: false                         # Bật thu thập bảng xếp hạng nền tảng hay không (true=bật, false=tắt)
  api_url: ""                            # Địa chỉ API dữ liệu xu hướng (để trống sẽ dùng địa chỉ mặc định)
                                        # Nếu bạn tự triển khai newsnow, điền địa chỉ của bạn, ví dụ: https://your-domain.com/api/s
  sources:
    - id: "toutiao"
      name: "Toutiao"
      expected_domain: "toutiao.com"
      "enabled": false
    - id: "baidu"
      name: "Baidu - Tin nổi bật"
      expected_domain: "baidu.com"
      "enabled": false
    - id: "wallstreetcn-hot"
      name: "WallStreetCN"
      expected_domain: "wallstreetcn.com"
      "enabled": false
    - id: "thepaper"
      name: "The Paper"
      expected_domain: "thepaper.cn"
      "enabled": false
    - id: "bilibili-hot-search"
      name: "Bilibili - Tin nổi bật"
      expected_domain: "bilibili.com"
      "enabled": false
    - id: "cls-hot"
      name: "CLS - Tin nổi bật"
      expected_domain: "cls.cn"
      "enabled": false
    - id: "ifeng"
      name: "iFeng"
      expected_domain: "ifeng.com"
      "enabled": false
    - id: "tieba"
      name: "Tieba"
      expected_domain: "baidu.com"
      "enabled": false
    - id: "weibo"
      name: "Weibo"
      expected_domain: "weibo.com"
      "enabled": false
    - id: "douyin"
      name: "Douyin"
      expected_domain: "douyin.com"
      "enabled": false
    - id: "zhihu"
      name: "Zhihu"
      expected_domain: "zhihu.com"



# ===============================================================
# 3. Nguồn dữ liệu - đăng ký RSS
#
# Lưu riêng với dữ liệu bảng xếp hạng xu hướng và hiển thị theo dòng thời gian
# Cấu hình mỗi nguồn: id (mã duy nhất), name (tên hiển thị), url (địa chỉ đăng ký)
# enabled: Không bắt buộc, mặc định là true
# max_age_days: Không bắt buộc, ghi đè freshness_filter.max_age_days toàn cục
# ===============================================================
      "enabled": false
rss:
  enabled: true                       # Bật thu thập RSS hay không (true=bật, false=tắt)

  # Bộ lọc độ mới của bài viết (loại bài quá cũ để tránh gửi trùng)
  # Chỉ lọc ở bước gửi thông báo; mọi bài viết vẫn được lưu vào cơ sở dữ liệu
  freshness_filter:
    enabled: true                     # Bật bộ lọc độ mới hay không (true=bật, false=tắt)

    max_age_days: 1                   # Tuổi tối đa của bài viết (ngày)
                                      # - Số nguyên dương: chỉ gửi bài trong vòng N ngày
                                      # - 0: tắt bộ lọc, gửi tất cả bài viết

  # Có thể cấu hình max_age_days riêng cho từng feed để ghi đè thiết lập toàn cục:
  # - Không cấu hình: dùng freshness_filter.max_age_days toàn cục (hiện đặt 1 ngày; nếu thiếu cấu hình thì mặc định 3 ngày)
  # - Số nguyên dương: ghi đè thiết lập toàn cục, chỉ gửi bài trong số ngày này
  # - 0: tắt bộ lọc độ mới cho feed này, gửi tất cả bài viết
  feeds:
    - id: "hacker-news"
      name: "Hacker News"
      url: "https://hnrss.org/frontpage"

      "enabled": false
    - id: "ruanyifeng"
      name: "Blog của Ruan Yifeng"
      url: "http://www.ruanyifeng.com/blog/atom.xml"
      enabled: false # Tắt nguồn này
      # max_age_days: 3               # Ví dụ: gửi bài trong vòng 3 ngày (dành cho blog cập nhật chậm)
     
    - id: "yahoo-finance"
      name: "Yahoo Finance"
      url: "https://finance.yahoo.com/news/rssindex"

    # Ví dụ về nguồn tùy chỉnh
    # - id: "custom-feed"
    #   name: "Nguồn tùy chỉnh"
    #   url: "https://example.com/feed.xml"
    #   enabled: false
    #   max_age_days: 0               # Ví dụ: tắt bộ lọc, gửi tất cả bài viết


# ===============================================================
# 4. Chế độ báo cáo
