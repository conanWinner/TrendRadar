      "enabled": false
    - {"id": "vnexpress-tech", "name": "VnExpress — Khoa học công nghệ (VI)", "url": "https://vnexpress.net/rss/khoa-hoc-cong-nghe.rss", "enabled": false, "max_age_days": 3}
    - {"id": "vnexpress-sports", "name": "VnExpress — Thể thao (VI)", "url": "https://vnexpress.net/rss/the-thao.rss", "enabled": true, "max_age_days": 3}
    - {"id": "tuoitre-tech", "name": "Tuổi Trẻ — Nhịp sống số (VI)", "url": "https://tuoitre.vn/rss/nhip-song-so.rss", "enabled": false, "max_age_days": 3}
    - {"id": "tuoitre-sports", "name": "Tuổi Trẻ — Thể thao (VI)", "url": "https://tuoitre.vn/rss/the-thao.rss", "enabled": false, "max_age_days": 3}
